<!DOCTYPE html>

<html lang="zh-CN">
<head>
  
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>用户登录 - CityGo</title>
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body class="auth-body">
  
  <header class="topbar glass">
    <div class="logo">CityGo<span>城市旅行</span></div>
    <nav>
      <a href="index.html">首页</a>
      <a href="footprint.html">旅行足迹</a>
      <a href="diary.html">旅行日记</a>
      <a href="wishlist.html">心愿单</a>
      <a href="category.html">分类浏览</a>
      <a href="about.html">关于网站</a>
      <a href="contact.html">联系我们</a>
      <a href="login.html" id="loginLink" class="active">登录</a>
      <a href="register.html" id="registerLink" class="btn-nav">注册</a>
      <button class="logout-btn hidden" id="logoutBtn">退出登录</button>
    </nav>
  </header>

  
  <main class="auth-container">
    <section class="auth-card">
      <p class="eyebrow">Welcome Back</p>
      <h1>用户登录</h1>
      <p class="auth-tip">欢迎回到 CityGo，登录后可继续收藏心动城市、管理旅行心愿单，并规划属于你的下一段旅程。</p>
      
      <form id="loginForm">
        <label>用户名</label>
        <input type="text" id="loginName" placeholder="请输入用户名" />
        <span class="error" id="loginNameError"></span>

        <label>密码</label>
        <input type="password" id="loginPwd" placeholder="请输入密码" />
        <span class="error" id="loginPwdError"></span>

        <button type="submit" class="primary-btn full">登录</button>
        <p class="success" id="loginSuccess"></p>
      </form>
      <div class="demo-account-box" id="defaultAccountList"></div>
      <p class="switch-link">还没有账号？<a href="register.html">立即注册</a></p>
    </section>
  </main>

  
  <script src="seed-data.js"></script>
  <script src="auth.js"></script>
  <script src="user-nav.js"></script>
  <script src="scroll-reveal.js"></script>
</body>
</html>
