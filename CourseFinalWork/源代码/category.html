      },
      {
        id: "chongqing",
        name: "重庆",
        type: "food",
        img: "resource/images/chongqing/chongqing_main.jpg",
        intro: "重庆以山城地貌、立体交通和热辣美食吸引游客，是极具辨识度的网红旅行城市。",
        scenery: "洪崖洞、解放碑、长江索道、磁器口、南山夜景",

      },
      {

        name: "广州",
        type: "food",
        img: "resource/images/guangzhou/guangzhou_main.jpg",
        intro: "广州是粤菜发源地之一，早茶文化浓厚，兼具历史底蕴与现代活力。",
        scenery: "广州塔、沙面、陈家祠、白云山、长隆",
        food: "虾饺、肠粉、烧鹅、煲仔饭、双皮奶",
        culture: "岭南文化、广府文化、商贸传统",

      },
      {
        id: "nanjing",
        name: "南京",
        type: "history",
        img: "resource/images/nanjing/nanjing_main.jpg",
        intro: "六朝古都，民国遗韵，秦淮河畔感受历史与现代的交融。",
        scenery: "中山陵、夫子庙、总统府、玄武湖、明孝陵",
        food: "盐水鸭、鸭血粉丝汤、汤包、梅花糕",
        culture: "六朝文化、民国文化、科举文化",
        season: "3月—5月，9月—11月",
        tags: ["历史古都", "民国风情", "秦淮河"]
      },
      {
        id: "xian",
        name: "西安",
        type: "history",
        img: "resource/images/xian/xian_main.jpg",
        intro: "世界四大古都之一，秦汉唐文化汇聚，美食与历史并重。",
        scenery: "兵马俑、大雁塔、古城墙、回民街、华清池",
        food: "肉夹馍、凉皮、羊肉泡馍、Biángbiáng面",
        culture: "秦汉文化、盛唐文化、丝路起点",
        season: "3月—6月，9月—11月",
        tags: ["历史古都", "兵马俑", "碳水天堂"]
      }
    
    ];
    

    const allowedTypes = ['all', 'food', 'nature', 'history', 'modern'];
    const titleMap = {
      all: '全部城市',
      food: '美食城市',
      nature: '自然风光',
      history: '历史文化',
      modern: '现代都市'
    };
    const descMap = {
      all: '浏览所有城市推荐',
      food: '寻找美食之都，体验地道风味',
      nature: '拥抱自然，享受山水之美',
      history: '探寻历史遗迹，感受文化沉淀',
      modern: '漫步摩登都市，发现现代魅力'
    };

    const categoryTitle = document.getElementById('categoryTitle');
    const categoryDesc = document.getElementById('categoryDesc');
    const grid = document.getElementById('categoryGrid');
    const buttons = document.querySelectorAll('.cat-btn');

    function getCurrentType() {
      const urlType = new URLSearchParams(window.location.search).get('type');
      return allowedTypes.includes(urlType) ? urlType : 'all';
    }

    function updateActiveButton(type) {
      buttons.forEach(btn => btn.classList.toggle('active', btn.dataset.type === type));
    }

    function buildCards(type) {
      const filtered = type === 'all' ? cities : cities.filter(city => city.type === type);
      if (filtered.length === 0) {
        return '<div class="empty-state category-empty">暂无城市，请尝试其他分类。</div>';
      }
      return filtered.map((city, index) => `
        <article class="city-card category-card-reveal" data-city-id="${city.id}" style="--category-delay:${Math.min(index, 11) * 0.09}s;">
          <img src="${city.img}" alt="${city.name}" />
          <div class="city-card-body">
            <h3>${city.name}</h3>
            <p>${city.intro}</p>
            <div class="tag-row">${city.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}</div>
            <div class="card-actions">
              <button class="small-btn detail-btn" type="button" data-id="${city.id}">查看详情</button>
              <a class="small-btn page-btn" href="city.html?id=${city.id}&from=category">详细介绍</a>
              <button class="small-btn collect-btn" type="button" data-id="${city.id}">加入心愿单</button>
            </div>
          </div>
        </article>
      `).join('');
    }

    let categoryCardObserver = null;

    function initCategoryCardReveal() {
      const cards = Array.from(grid.querySelectorAll('.category-card-reveal'));
      if (categoryCardObserver) categoryCardObserver.disconnect();
      if (!cards.length) return;

      if (!('IntersectionObserver' in window)) {
        cards.forEach(card => card.classList.add('category-card-visible'));
        return;
      }

      categoryCardObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          const card = entry.target;
          if (entry.isIntersecting) {
            card.classList.add('category-card-visible');
            return;
          }

          if (entry.boundingClientRect.top > window.innerHeight || entry.boundingClientRect.bottom < 0) {
            card.classList.add('category-card-resetting');
            card.classList.remove('category-card-visible');
            requestAnimationFrame(() => {
              requestAnimationFrame(() => card.classList.remove('category-card-resetting'));
            });
          }
        });
      }, { threshold: 0.16, rootMargin: '0px 0px -4% 0px' });

      cards.forEach(card => categoryCardObserver.observe(card));
    }

    function renderCategory(type, options = {}) {
      const shouldPushState = options.pushState !== false;
      const url = `category.html?type=${type}`;
      updateActiveButton(type);
      categoryTitle.innerText = titleMap[type];
      categoryDesc.innerText = descMap[type];

      grid.classList.add('category-grid-switching');
      window.setTimeout(() => {
        grid.innerHTML = buildCards(type);
        grid.classList.remove('category-grid-switching');
        initCategoryCardReveal();
      }, 160);

      if (shouldPushState) {
        history.pushState({ type }, '', url);
      }
    }

    buttons.forEach(btn => {
      btn.addEventListener('click', function (event) {
        event.preventDefault();
        const nextType = this.dataset.type;
        if (!allowedTypes.includes(nextType)) return;
        renderCategory(nextType);
      });
    });

    window.addEventListener('popstate', () => {
      renderCategory(getCurrentType(), { pushState: false });
    });

    renderCategory(getCurrentType(), { pushState: false });

    if (window.CityGoCityModal) {
      window.CityGoCityModal.init(cities);
    }

    grid.addEventListener('click', function (event) {
      const actionTarget = event.target.closest('button, a');
      const card = event.target.closest('.city-card');

      if (actionTarget && actionTarget.classList.contains('page-btn')) return;

      if (actionTarget) {
        const id = actionTarget.dataset.id;
        if (!id) return;
        const city = cities.find(item => item.id === id);
        if (actionTarget.classList.contains('detail-btn') && window.CityGoCityModal) {
          window.CityGoCityModal.open(id);
        }
        if (actionTarget.classList.contains('collect-btn') && window.CityGoCityModal) {
          window.CityGoCityModal.addToWishlist(city);
        }
        return;
      }

      if (card && card.dataset.cityId && window.CityGoCityModal) {
        window.CityGoCityModal.open(card.dataset.cityId);
      }
    });

    function updateNavStatus() {
      const user = JSON.parse(localStorage.getItem("citygo_current_user") || "null");
      const loginLink = document.getElementById("loginLink");
      const registerLink = document.getElementById("registerLink");
      const logoutBtn = document.getElementById("logoutBtn");
      if (user) {
        loginLink.innerText = user.username;
        loginLink.href = "user.html";
        registerLink.classList.add("hidden");
        logoutBtn.classList.remove("hidden");
      }
      if (logoutBtn) {
        logoutBtn.addEventListener("click", () => {
          localStorage.removeItem("citygo_current_user");
          location.reload();
        });
      }
    }
    updateNavStatus();
  </script>

  <style>
    
    .category-body {
      background:
        radial-gradient(circle at 12% 16%, rgba(22,119,255,0.16), transparent 28%),
        radial-gradient(circle at 88% 10%, rgba(255,159,67,0.18), transparent 24%),
        linear-gradient(135deg, #eef6ff 0%, #ffffff 48%, #fff8ef 100%);
    }

    .category-page {
      position: relative;
      overflow: hidden;
    }

    .category-page::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        linear-gradient(135deg, rgba(244,248,255,0.80), rgba(255,255,255,0.86)),
        url("resource/images/hangzhou/hangzhou_westlake_morning.jpg") center/cover no-repeat;
      filter: blur(8px) saturate(1.08);
      transform: scale(1.04);
      opacity: 0.42;
      pointer-events: none;
    }

    .category-filter-bar {
      position: relative;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      width: fit-content;
      max-width: 100%;
      margin: 0 0 30px;
      padding: 12px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(255,255,255,0.88), rgba(238,246,255,0.74));
      border: 1px solid rgba(255,255,255,0.78);
      box-shadow: 0 18px 42px rgba(31, 64, 125, 0.12);
      backdrop-filter: blur(18px);
    }

    .category-filter-bar::before {
      content: "";
      position: absolute;
      inset: 5px;
      border-radius: inherit;
      background: linear-gradient(135deg, rgba(255,255,255,0.52), rgba(22,119,255,0.07));
      pointer-events: none;
    }

    .cat-btn {
      position: relative;
      z-index: 1;
      padding: 9px 19px;
      border-radius: 999px;
      background: rgba(255,255,255,0.76);
      border: 1px solid rgba(22,119,255,0.10);
      color: #305070;
      text-decoration: none;
      font-weight: 600;
      box-shadow: 0 8px 18px rgba(31, 64, 125, 0.06);
      transition:
        transform 0.34s ease,
        box-shadow 0.34s ease,
        background 0.34s ease,
        color 0.34s ease,
        border-color 0.34s ease;
    }

    .cat-btn.active {
      color: #fff;
      border-color: rgba(22,119,255,0.72);
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      box-shadow: 0 14px 28px rgba(22,119,255,0.22);
      transform: translateY(-1px);
    }

    .cat-btn:hover {
      transform: translateY(-3px);
      border-color: rgba(22,119,255,0.35);
      box-shadow: 0 16px 32px rgba(22,119,255,0.16);
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, 300px);
      justify-content: center;
      gap: 26px;
      padding: 24px;
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(238,246,255,0.68));
      border: 1px solid rgba(255,255,255,0.78);
      box-shadow: 0 22px 54px rgba(31, 64, 125, 0.10);
      transition: opacity 0.34s ease, transform 0.34s ease, filter 0.34s ease;
    }

    .category-grid.category-grid-switching {
      opacity: 0;
      transform: translateY(12px);
      filter: blur(4px);
    }

    .category-grid .city-card {
      width: 300px;
      max-width: 300px;
      min-height: 0;
      height: 400px;
      display: flex;
      flex-direction: column;
      border-radius: 26px;
      overflow: hidden;
      transition:
        transform 0.58s cubic-bezier(0.22, 1, 0.36, 1),
        box-shadow 0.58s cubic-bezier(0.22, 1, 0.36, 1),
        border-color 0.58s ease,
        filter 0.58s ease;
      will-change: transform, box-shadow;
      backface-visibility: hidden;
    }

    .category-grid .city-card:hover {
      transform: translate3d(0, -10px, 0);
      border-color: rgba(22, 119, 255, 0.32);
      box-shadow: 0 30px 68px rgba(22, 119, 255, 0.22);
      filter: saturate(1.04);
    }

    .category-grid .city-card img {
      height: 148px;
      flex: 0 0 148px;
      object-fit: cover;
    }

    .category-grid .city-card-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 14px;
    }

    .category-grid .city-card h3 {
      font-size: var(--text-lg);
      margin-bottom: 6px;
    }

    .category-grid .city-card p {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      font-size: var(--text-sm);
      line-height: 1.5;
      margin-bottom: 10px;
    }

    .category-grid .tag-row {
      gap: 6px;
      margin-top: auto;
      margin-bottom: 8px;
    }

    .category-grid .tag {
      font-size: var(--text-xs);
      padding: 4px 8px;
    }

    .category-grid .small-btn {
      padding: 10px;
      border-radius: 12px;
      font-size: var(--text-sm);
    }

    .category-grid .card-actions {
      margin-top: auto;
      display: grid;
      grid-template-columns: 0.92fr 0.92fr 1.28fr;
      gap: 8px;
      align-items: stretch;
    }

    .category-grid .card-actions .small-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 1.5;
      white-space: nowrap;
      padding-left: 9px;
      padding-right: 9px;
    }

    .category-card-reveal {
      opacity: 0;
      transform: translate3d(0, 30px, 0) scale(0.98);
      filter: blur(5px);
      transition:
        opacity 0.82s ease var(--category-delay, 0s),
        transform 0.82s cubic-bezier(0.22, 1, 0.36, 1) var(--category-delay, 0s),
        filter 0.82s ease var(--category-delay, 0s),
        box-shadow 0.58s cubic-bezier(0.22, 1, 0.36, 1),
        border-color 0.58s ease;
    }

    .category-card-reveal.category-card-visible {
      opacity: 1;
      transform: translate3d(0, 0, 0) scale(1);
      filter: blur(0);
    }

    .category-card-reveal.category-card-resetting {
      transition: none;
    }

    .category-card-reveal.category-card-visible:hover {
      transform: translate3d(0, -10px, 0) scale(1);
      border-color: rgba(22, 119, 255, 0.32);
      box-shadow: 0 30px 68px rgba(22, 119, 255, 0.22);
      filter: saturate(1.04);
    }

    .category-empty {
      grid-column: 1 / -1;
      width: min(520px, 100%);
      justify-self: center;
    }

    @media (max-width: 980px) {
      .category-grid {
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      }
    }

    @media (max-width: 640px) {
      .category-filter-bar {
        width: 100%;
        justify-content: center;
        border-radius: 26px;
      }

      .cat-btn {
        flex: 1 1 42%;
        text-align: center;
      }

      .category-grid {
        grid-template-columns: minmax(0, 1fr);
        padding: 18px;
      }

      .category-grid .city-card {
        max-width: 100%;
        height: auto;
        min-height: 0;
      }
    }

    
    .category-grid {
      background: linear-gradient(135deg, rgba(224, 238, 255, 0.82), rgba(250, 252, 255, 0.94));
      border: 1px solid rgba(198, 218, 246, 0.78);
    }
