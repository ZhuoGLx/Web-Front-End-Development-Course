<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>ProductsCard</title>
  <link rel="stylesheet" href="./index_style.css">
</head>
<body>
<div class="container">
  <div class="product-list">

    <div class="product-card">
      <div class="card-img">
        <img src="./pictures/product_1.jpg">
        <div class="product-tag">热卖</div>
        <div class="price-tag">¥299.00</div>
      </div>
      <div class="product-text">
        <p class="product-name">秋季新款休闲外套 宽松版型</p>
      </div>
    </div>

    <div class="product-card">
      <div class="card-img">
        <img src="./pictures/product_2.jpg">
        <div class="product-tag">爆款</div>
        <div class="price-tag">¥59.90</div>
      </div>
      <div class="product-text">
        <p class="product-name">全自动防晒伞 晴雨两用</p>
      </div>
    </div>

    <div class="product-card">
      <div class="card-img">
        <img src="./pictures/product_3.jpg">
        <div class="product-tag">新品</div>
        <div class="price-tag">¥159.00</div>
      </div>
      <div class="product-text">
        <p class="product-name">美味小零食</p>
      </div>
    </div>

    <div class="product-card">
      <div class="card-img">
        <img src="./pictures/product_4.jpg">
        <div class="product-tag">热卖</div>
        <div class="price-tag">¥3999.00</div>
      </div>
      <div class="product-text">
        <p class="product-name">xx牌xx手机</p>
      </div>
    </div>

    <div class="product-card">
      <div class="card-img">
        <img src="./pictures/product_5.jpg">
        <div class="product-tag">清仓</div>
        <div class="price-tag">¥89.90</div>
      </div>
      <div class="product-text">
        <p class="product-name">绒毛可爱小熊</p>
      </div>
    </div>

    <div class="product-card">
      <div class="card-img">
        <img src="./pictures/product_6.jpg">
        <div class="product-tag">爆款</div>
        <div class="price-tag">¥1129.00</div>
      </div>
      <div class="product-text">
        <p class="product-name">酱香国窖米酒</p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
